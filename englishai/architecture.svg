<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">EnglishAI Ecosystem System Architecture</title><desc id="desc">English learning resources flow through the knowledge base, RAG retrieval, local LLM and MCP integration layer into specialised English learning tools and the student and teacher interface.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b2c4a" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b7567"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94242"/></marker></defs><rect width="1400" height="1250" fill="#f6f0df"/><text x="700" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#1d3157">EnglishAI Ecosystem — system architecture</text><g font-family="Georgia,serif" text-anchor="middle" filter="url(#shadow)"><rect x="450" y="92" width="500" height="78" rx="20" fill="#fff" stroke="#1d3157" stroke-width="4"/><text x="700" y="141" font-size="27" fill="#1d3157">English learning resources</text><path d="M700 170v48" stroke="#7b7567" stroke-width="4" marker-end="url(#arrow)"/><rect x="400" y="218" width="600" height="78" rx="20" fill="#fff" stroke="#1d3157" stroke-width="4"/><text x="700" y="267" font-size="26" fill="#1d3157">Knowledge base + metadata</text><path d="M700 296v48" stroke="#7b7567" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="344" width="460" height="78" rx="20" fill="#fff" stroke="#1d3157" stroke-width="4"/><text x="700" y="393" font-size="26" fill="#1d3157">RAG / retrieval</text><path d="M700 422v48" stroke="#7b7567" stroke-width="4" marker-end="url(#arrow)"/><rect x="500" y="470" width="400" height="88" rx="20" fill="#1d3157"/><text x="700" y="524" font-size="2