-width="3"><path d="M700 694L121 755M700 694L313 755M700 694L505 755M700 694L697 755M700 694L889 755M700 694L1081 755M700 694L1273 755"/></g><g stroke="#8a8475" stroke-width="3"><path d="M121 883L500 968M313 883L560 968M505 883L620 968M697 883L700 968M889 883L780 968M1081 883L840 968M1273 883L900 968"/></g><rect x="460" y="968" width="480" height="90" rx="22" fill="#1d3157" filter="url(#shadow)"/><text x="700" y="1010" font-family="Georgia,serif" font-size="25" fill="#fff">Student / teacher UI</text><text x="700" y="1038" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ef8d8d">ask · explain · practise · feedback · revise</text><g font-size="15" fill="#6f6a5e"><circle cx="255" cy="1122" r="8" fill="#fff" stroke="#1d3157" stroke-width="3"/><text x="275" y="1128" text-anchor="start">pipeline stage</text><circle cx="565" cy="1122" r="8" fill="#1d3157"/><text x="585" y="1128" text-anchor="start">core inference / UI</text><circle cx="890" cy="1122" r="8" fill="#fff" stroke="#c94242" stroke-width="3"/><text x="910" y="1128" text-anchor="start">MCP-governed boundary</text></g><text x="700" y="1190" font-family="Georgia,serif" font-size="16" font-style="italic" fill="#8b836f">Every arrow into the MCP layer is a typed, versioned and auditable tool contract.</text></g></svg>