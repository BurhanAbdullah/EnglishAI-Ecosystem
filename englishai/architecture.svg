<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">EnglishAI Ecosystem — system architecture</title><desc id="desc">Wine-red and white architecture showing English learning resources, knowledge base and metadata, RAG retrieval, configurable local LLM, MCP integration layer, specialist learning tools, and student teacher interface.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5d1425" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a1f32"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a22d43"/></marker></defs><rect width="1400" height="1250" fill="#fffdfc"/><rect width="1400" height="1250" fill="#f8ecef" opacity=".45"/><text x="700" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" fill="#5d1425">EnglishAI Ecosystem — system architecture</text><line x1="0" y1="78" x2="1400" y2="78" stroke="#ead9de" stroke-width="2"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)"><rect x="450" y="100" width="500" height="78" rx="20" fill="#fff" stroke="#7a1f32" stroke-width="4"/><text x="700" y="149" font-size="27" fill="#5d1425">English learning resources</text><path d="M700 178v48" stroke="#7a1f32" stroke-width="4" marker-end="url(#arrow)"/><rect x="400" y="226" width="600" height="78" rx="20" fill="#fff" stroke="#7a1f32" stroke-width="4"/><text x="700" y="275" font-size="26" fill="#5d1425">Knowledge base + metadata</text><path d="M700 304v48" stroke="#7a1f32" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="352" width="460" height="78" rx="20" fill="#fff" stroke="#7a1f32" stroke-width="4"/><text x="700" y="401" font-size="26" fill="#5d1425">RAG / retrieval</text><path d="M700 430v48" stroke="#7a1f32" stroke-width="4" marker-end="url(#arrow)"/><rect x="500" y="478" width="400" height="88" rx="20" fill="#7a1f32"/><text x="700" y="532" font-size="27" font-weight="800" fill="#fff">Local LLM</text><text x="700" y="552" font-size="12" fill="#f5dce2">configurable model inference</text><path d="M700 566v48" stroke="#a22d43" stroke-width="5" marker-end="url(#redArrow)"/><rect x="365" y="614" width="670" height="88" rx="20" fill="#fff" stroke="#a22d43" stroke-width="5"/><text x="700" y="655" font-size="25" font-weight="800" fill="#a22d43">MCP integration layer</text><text x="700" y="684" font-size="16" font-style="italic" fill="#806d73">typed · validated · permissioned · auditable</text></g><g stroke="#d7bdc4" stroke-width="3" fill="#fff" filter="url(#shadow)"><rect x="32" y="755" width="178" height="128" rx="18"/><rect x="224" y="755" width="178" height="128" rx="18"/><rect x="416" y="755" width="178" height="128" rx="18"/><rect x="608" y="755" width="178" height="128" rx="18"/><rect x="800" y="755" width="178" height="128" rx="18"/><rect x="992" y="755" width="178" height="128" rx="18"/><rect x="1184" y="755" width="178" height="128" rx="18" stroke="#a22d43"/></g><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g font-size="18" font-weight="800" fill="#5d1425"><text x="121" y="794">ENGLISH-CONTENT</text><text x="313" y="794">GRAMMAR</text><text x="505" y="794">VOCABULARY</text><text x="697" y="794">READING</text><text x="889" y="794">WRITING</text><text x="1081" y="794">ASSESSMENT</text><text x="1273" y="794" fill="#a22d43">CITATION</text></g><g font-size="14" fill="#806d73"><text x="121" y="828">resources &amp;</text><text x="121" y="849">provenance</text><text x="313" y="828">rules &amp;</text><text x="313" y="849">error analysis</text><text x="505" y="828">definitions &amp;</text><text x="505" y="849">spaced recall</text><text x="697" y="828">comprehension</text><text x="697" y="849">&amp; evidence<