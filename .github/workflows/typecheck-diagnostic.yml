name: Typecheck diagnostic
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false > typecheck.log 2>&1 || true
      - run: cat typecheck.log
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
