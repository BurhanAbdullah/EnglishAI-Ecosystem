name: Deploy EnglishAI website

on:
  push:
    branches: [main]
    paths:
      - 'englishai/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build standalone website artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp englishai/*.html _site/
          cp englishai/*.svg _site/
          cp englishai/site-v2.css _site/site-v2.css
          cp englishai/site.js _site/site.js
          test -s _site/index.html
          test -s _site/architecture.html
          test -s _site/team.html
          test -s _site/contribute.html
          test -s _site/join.html
          test -s _site/site-v2.css
          test -s _site/site.js
          test -s _site/logo.svg
          test -s _site/architecture.svg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
