name: Deploy EnglishAI website

on:
  push:
    branches: [main]
    paths:
      - 'englishai/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp englishai/index.html _site/index.html
          cp englishai/banner.svg _site/banner.svg
          cp englishai/logo.svg _site/logo.svg
          cp englishai/architecture.svg _site/architecture.svg
          cp web/styles.css _site/styles.css
          cp web/app.js _site/app.js
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('../web/styles.css', './styles.css')
          s = s.replace('../web/app.js', './app.js')
          p.write_text(s, encoding='utf-8')
          PY
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/logo.svg
          test -s _site/banner.svg
          test -s _site/architecture.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
