name: Modern English CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify Node and npm
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - name: MCP gateway and tutor integration test
        run: npm run verify:mcp-gateway
      - name: Website validation
        run: npm run validate:site

  pages-smoke:
    name: Static Pages Smoke Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required pages and assets
        run: |
          set -eu
          for f in index.html platform.html capabilities.html architecture.html research.html docs.html tutor.html learner.html join.html login.html profile.html dashboard.html about.html admin/login.html assets/site.css assets/ux.css assets/tokens.css assets/learner-app.js assets/adaptive-lesson.js assets/secure-store.js assets/auth.js assets/profile.js assets/dashboard.js assets/auth-pages.js assets/admin-auth.js; do
            test -f "docs/$f"
          done
          node <<'NODE'
          const fs = require('fs');
          const checks = [
            ['Modern English landing page', 'docs/index.html', 'Modern English'],
            ['landing page join link', 'docs/index.html', 'join.html'],
            ['landing page about link', 'docs/index.html', 'about.html'],
            ['project lead name', 'docs/join.html', 'Dr. Mudasir Rahman'],
            ['project lead GitHub handle', 'docs/join.html', 'Drmudasirrahman'],
            ['site font declaration', 'docs/assets/site.css', 'font-family'],
            ['site Inter font', 'docs/assets/site.css', 'Inter'],
            ['token font declaration', 'docs/assets/tokens.css', 'font-family'],
            ['token Inter font', 'docs/assets/tokens.css', 'Inter'],
            ['encrypted local storage', 'docs/assets/secure-store.js', 'AES-GCM'],
            ['adaptive lesson UI', 'docs/assets/adaptive-lesson.js', 'adaptiveLesson']
          ];
          const failures = [];
          for (const [label, file, needle] of checks) {
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes(needle)) failures.push(`${label}: missing "${needle}" in ${file}`);
          }
          if (failures.length) {
            console.error('Static Pages Smoke Test failed:');
            for (const failure of failures) console.error(` - ${failure}`);
            process.exit(1);
          }
          console.log(`Static Pages Smoke Test passed (${checks.length} content checks).`);
          NODE
