<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin sign in — Modern English</title><meta name="description" content="Administrative sign in for the Modern English platform."><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/ux.css"><style>body{background:var(--color-bg-dark);color:var(--color-text-inverse)}.admin-shell{min-height:100vh;display:grid;place-items:center;padding:32px 18px}.admin-wrap{width:min(460px,100%)}.admin-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;letter-spacing:-.045em;margin-bottom:34px}.admin-brand .mark{background:var(--color-accent)}.admin-eyebrow{font:10px/1 var(--font-mono);letter-spacing:.18em;color:#ff514b;text-transform:uppercase;margin-bottom:14px}.admin-card{background:var(--color-surface-dark);border:1px solid #29292d;border-radius:var(--radius-panel);padding:34px}.admin-card h1{font-size:46px;margin-bottom:12px}.admin-card p{color:#aaa}.field{margin-top:17px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#ddd}.field input{width:100%;padding:13px 14px;border:1px solid #38383e;border-radius:11px;background:#0a0a0b;color:#fff;font:inherit}.field input:focus{outline:none;border-color:var(--color-accent)}.admin-card .btn{width:100%;margin-top:22px}.admin-note{font:11px/1.6 var(--font-mono);color:#777;margin-top:18px}</style></head><body><main class="admin-shell"><section class="admin-wrap"><a class="admin-brand" href="../index.html"><span class="mark">M</span><span>Modern <i>English</i></span></a><div class="admin-eyebrow">ADMINISTRATIVE ACCESS</div><div class="admin-card"><h1>Admin sign in.</h1><p>This surface is intentionally separate from the learner experience.</p><form id="adminForm"><div class="field"><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Continue →</button></form><p id="notice" class="admin-note">Administrator authentication must be provided by the configured backend service; this static surface never stores credentials.</p></div></section></main><script src="../assets/auth.js" defer></script><script src="../assets/admin-auth.js" defer></script></body></html>
