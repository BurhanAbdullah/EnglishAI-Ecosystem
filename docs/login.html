<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Log in — Modern English</title><meta name="description" content="Log in to your Modern English learner account."><link rel="stylesheet" href="./assets/tokens.css"><link rel="stylesheet" href="./assets/site.css"><link rel="stylesheet" href="./assets/ux.css"><style>.auth-shell{max-width:1180px;margin:auto;padding:110px 24px 120px}.auth-layout{max-width:560px;margin:auto}.auth-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-panel);padding:38px;box-shadow:var(--shadow-card)}.auth-card h1{font-size:clamp(44px,6vw,68px)}.provider{width:100%;margin-top:10px}.divider{display:flex;align-items:center;gap:12px;color:var(--color-text-soft);font:12px var(--font-mono);margin:22px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--color-border)}.auth-foot{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:24px;font-size:13px}.auth-foot a{color:var(--color-accent);font-weight:800;text-decoration:none}.notice{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--color-accent-soft);color:#8b2521;font-size:12px}.field{margin-top:15px}.field label{display:block;margin-bottom:7px}.field input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--color-border-strong);border-radius:12px}.field input:focus{outline:0;border-color:rgba(225,6,0,.55);box-shadow:0 0 0 4px rgba(225,6,0,.08)}@media(max-width:600px){.auth-shell{padding:72px 18px 90px}.auth-card{padding:24px}.auth-foot{align-items:flex-start;flex-direction:column}}</style></head><body class="internal-page"><header class="nav"><a class="brand" href="./index.html"><span class="mark">M</span><span>Modern <i>English</i></span></a><nav class="desktop-nav"></nav><div class="nav-actions"></div></header><main class="auth-shell"><section class="auth-layout"><div class="eyebrow">MODERN ENGLISH · LEARNER ACCOUNT</div><div class="auth-card"><h1>Welcome <em>back.</em></h1><p class="lead">Sign in to continue your personalized learning path.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div class="actions"><button class="btn primary provider" type="submit">Sign in →</button></div></form><div class="divider">OR</div><a class="btn provider" href="https://englishai-auth-api.onrender.com/auth/github">Continue with GitHub ↗</a><div id="notice" class="notice"></div><div class="auth-foot"><span>New learner?</span><a href="./signup.html">Create your account →</a></div></div></section></main><script src="./assets/auth.js" defer></script><script src="./assets/auth-pages.js" defer></script></body></html>
